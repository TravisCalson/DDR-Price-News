name: Daily DDR price update

on:
  schedule:
    # 01:23 UTC = 09:23 China (UTC+8). Avoid :00 to reduce cron queue delays.
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD, China time). Empty = today."
        required: false
        default: ""
      mode:
        description: "full = generate + aggregate, aggregate = rebuild aggregates only"
        required: false
        default: "full"

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate daily artifacts (Claude)
        if: ${{ inputs.mode != 'aggregate' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          fi
          python scripts/daily_update.py $ARGS

      - name: Rebuild history aggregates
        run: python scripts/aggregate.py

      - name: Validate JSON schemas
        run: python scripts/validate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update $(date -u +%F)"
            git push
          fi
